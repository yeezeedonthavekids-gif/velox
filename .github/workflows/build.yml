# Builds and tests everything on every push. The Fabric mod needs Mojang and Fabric servers
# to compile, so CI is where it is first compiled against the real Minecraft 26.3 jar.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # lets tagged builds publish a GitHub Release

jobs:
  core-and-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: test core and launcher
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build Fabric mod
        working-directory: mod
        run: chmod +x ./gradlew && ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: velox-mod
          path: mod/build/libs/

  package:
    needs: [core-and-launcher, mod]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: velox-mod
          path: mod/build/libs/
      - name: launcher jar with the mod bundled
        run: ./gradlew :launcher:fatJar
      - uses: actions/upload-artifact@v7
        with:
          name: velox-launcher
          path: launcher/build/libs/velox-launcher-*.jar

  windows-installer:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: velox-launcher
          path: launcher-jar
      - name: WiX Toolset (needed by jpackage for .exe installers)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) { choco install wixtoolset -y --no-progress; $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -First 1 }
            Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName 'bin')
          }
      - name: build installer
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Jar (Get-ChildItem launcher-jar/velox-launcher-*.jar | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: velox-windows
          path: dist/
      - name: publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.exe, dist/*.zip) `
            --title "Velox ${{ github.ref_name }}" `
            --notes "Download **Velox-*.exe** and run it. No Java needed; it's bundled. Windows may show a SmartScreen warning because the installer isn't code-signed yet: click *More info* -> *Run anyway*."
