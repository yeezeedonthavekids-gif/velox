# Builds and tests everything on every push. The Fabric mod needs Mojang and Fabric servers
# to compile, so CI is where it is first compiled against the real Minecraft 26.3 jar.
name: build
on: [push, pull_request]

jobs:
  core-and-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: test core and launcher
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build Fabric mod
        working-directory: mod
        run: chmod +x ./gradlew && ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: velox-mod
          path: mod/build/libs/

  package:
    needs: [core-and-launcher, mod]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: velox-mod
          path: mod/build/libs/
      - name: launcher jar with the mod bundled
        run: ./gradlew :launcher:fatJar
      - uses: actions/upload-artifact@v7
        with:
          name: velox-launcher
          path: launcher/build/libs/velox-launcher-*.jar
